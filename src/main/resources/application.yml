spring:
  datasource:
    url: jdbc:mysql://localhost:3306/SPOT?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_username}
    password: ${DB_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        #        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  # Email
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${mail_id}
    password: ${mail_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
#    auth-code-expiration-millis: 300000  # 5 * 60 * 1000 == 5분?
  # aws
  cloud:
    aws:
      s3:
        credentials:
          accessKey: ${AWS_S3_ACCESSKEY}
          secretKey: ${AWS_S3_SECRETKEY}
        bucket: ${AWS_S3_BUCKET}
      region:
        static: ${AWS_REGION}
      stack:
        auto: false

# # Redis
#  data:
#    redis:
#      host: localhost
#      port: 6379

  jwt:
    secret: ${JWT_secret}

logging:
  level:
    org.hibernate.SQL: debug
    org.springframework.security: debug
#    org.hibernate.orm.jdbc.bind: trace

springdoc:
  swagger-ui:
    groups-order: DESC
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    default-model-expand-depth: 2
    default-models-expand-depth: 2

  api-docs:
    path: /v3/api-docs

  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: true
  model-and-view-allowed: true
  paths-to-match:
    - /api/**