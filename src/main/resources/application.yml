spring:
  datasource:
    url: jdbc:mysql://localhost:3306/SPOT
    username: ${DB_username}
    password: ${DB_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        #        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Email
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${mail_id}
    password: ${mail_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
#    auth-code-expiration-millis: 300000  # 5 * 60 * 1000 == 5분?
  # aws
  cloud:
    aws:
      s3:
        credentials:
          accessKey: ${AWS_S3_ACCESSKEY}
          secretKey: ${AWS_S3_SECRETKEY}
        bucket: ${AWS_S3_BUCKET}
      region:
        static: ${AWS_REGION}
      stack:
        auto: false

# # Redis
#  data:
#    redis:
#      host: localhost
#      port: 6379

  jwt:
    secret: ${JWT_secret}

logging:
  level:
    org.hibernate.SQL: debug
#    org.hibernate.orm.jdbc.bind: trace
