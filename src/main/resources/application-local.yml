spring:
  datasource:
    url: jdbc:mysql://localhost:3306/SPOT?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_username}
    password: ${DB_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect